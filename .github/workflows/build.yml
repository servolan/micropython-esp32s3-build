name: Build MicroPython ESP32-S3 with gpio_hold

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
    - name: Checkout ce depot
      uses: actions/checkout@v4.2.2
      with:
        path: custom_module

    - name: Cloner MicroPython v1.24.0
      run: |
        git clone --depth 1 --branch v1.24.0 \
          https://github.com/micropython/micropython.git
        cd micropython
        git submodule update --init --depth 1

    - name: Installer dependances systeme
      run: |
        sudo apt-get update
        sudo apt-get install -y git wget flex bison gperf python3 python3-pip \
          cmake ninja-build ccache libffi-dev libssl-dev dfu-util libusb-1.0-0

    - name: Installer ESP-IDF v5.2.2
      run: |
        git clone --depth 1 --branch v5.2.2 \
          https://github.com/espressif/esp-idf.git
        cd esp-idf
        ./install.sh esp32s3

    - name: Compiler mpy-cross
      run: |
        source esp-idf/export.sh
        make -C micropython/mpy-cross -j$(nproc)

    - name: Compiler le firmware ESP32-S3
      run: |
        source esp-idf/export.sh
        cd micropython/ports/esp32
        make \
          BOARD=ESP32_GENERIC_S3 \
          USER_C_MODULES=$GITHUB_WORKSPACE/custom_module/gpio_hold_module/micropython.cmake \
          -j$(nproc)

    - name: Publier le firmware
      uses: actions/upload-artifact@v4.6.2
      with:
        name: firmware-esp32s3-gpio-hold
        path: micropython/ports/esp32/build-ESP32_GENERIC_S3/firmware.bin
        retention-days: 30
